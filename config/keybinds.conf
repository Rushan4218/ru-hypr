# Launch applications
bind = SUPER , Q, exec, kitty
bind = SUPER , R, exec, rofi -show drun -config ~/.config/ru-hypr/rofi/theme.rasi

# Reload this config
bind = SUPER  SHIFT, R, exec, hyprctl reload

# Window actions
bind = SUPER , C, killactive
bind = SUPER , F, fullscreen
bind = SUPER , P, togglefloating 
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Vim-style focus navigation
bind = SUPER , H, movefocus, l
bind = SUPER , L, movefocus, r
bind = SUPER , K, movefocus, u
bind = SUPER , J, movefocus, d

# Monitor-aware workspace switching
# Super + 1-9,0  →  workspace 1-10 on eDP-1 / 11-20 on HDMI-A-1
bind = SUPER, 1, exec, ~/.config/ru-hypr/scripts/workspace-switch.sh 1
bind = SUPER, 2, exec, ~/.config/ru-hypr/scripts/workspace-switch.sh 2
bind = SUPER, 3, exec, ~/.config/ru-hypr/scripts/workspace-switch.sh 3
bind = SUPER, 4, exec, ~/.config/ru-hypr/scripts/workspace-switch.sh 4
bind = SUPER, 5, exec, ~/.config/ru-hypr/scripts/workspace-switch.sh 5
bind = SUPER, 6, exec, ~/.config/ru-hypr/scripts/workspace-switch.sh 6
bind = SUPER, 7, exec, ~/.config/ru-hypr/scripts/workspace-switch.sh 7
bind = SUPER, 8, exec, ~/.config/ru-hypr/scripts/workspace-switch.sh 8
bind = SUPER, 9, exec, ~/.config/ru-hypr/scripts/workspace-switch.sh 9
bind = SUPER, 0, exec, ~/.config/ru-hypr/scripts/workspace-switch.sh 0

# Monitor aware move windows to workspaces
bind = SUPER SHIFT, 1, exec, ~/.config/ru-hypr/scripts/workspace-switch.sh 1 move
bind = SUPER SHIFT, 2, exec, ~/.config/ru-hypr/scripts/workspace-switch.sh 2 move
bind = SUPER SHIFT, 3, exec, ~/.config/ru-hypr/scripts/workspace-switch.sh 3 move
bind = SUPER SHIFT, 4, exec, ~/.config/ru-hypr/scripts/workspace-switch.sh 4 move
bind = SUPER SHIFT, 5, exec, ~/.config/ru-hypr/scripts/workspace-switch.sh 5 move
bind = SUPER SHIFT, 6, exec, ~/.config/ru-hypr/scripts/workspace-switch.sh 6 move
bind = SUPER SHIFT, 7, exec, ~/.config/ru-hypr/scripts/workspace-switch.sh 7 move
bind = SUPER SHIFT, 8, exec, ~/.config/ru-hypr/scripts/workspace-switch.sh 8 move
bind = SUPER SHIFT, 9, exec, ~/.config/ru-hypr/scripts/workspace-switch.sh 9 move
bind = SUPER SHIFT, 0, exec, ~/.config/ru-hypr/scripts/workspace-switch.sh 0 move

# Volume controls
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness controls
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Utilities
bind = SUPER  SHIFT, C, exec, hyprpicker -a 
bind = SUPER, V, exec, ~/.config/ru-hypr/scripts/clipboard
bind = SUPER, W, exec, ~/.config/ru-hypr/scripts/wallpaper-picker

# Screenshot

bind = , PRINT, exec, ~/.config/ru-hypr/scripts/screenshot-full
bind = SUPER, PRINT, exec, ~/.config/ru-hypr/scripts/screenshot-region
