# Start ru-hypr services and synchronize wallpaper colors.
exec-once = ~/.config/ru-hypr/scripts/start-session
exec-once = hypridle
exec-once = swayosd-server --config ~/.config/ru-hypr/swayosd/config.toml --style ~/.config/ru-hypr/swayosd/style.css 
exec-once = ~/.config/ru-hypr/scripts/battery-notify
