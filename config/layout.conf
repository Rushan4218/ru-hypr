general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgb(89b4fa)
    col.inactive_border = rgb(45475a)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 8
    shadow {
        enabled = true
        range = 4
        render_power = 3
    }
}

animations {
    enabled = true
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}
