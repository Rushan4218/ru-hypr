general {
    gaps_in = 4
    gaps_out = 8 
    border_size = 2

    col.active_border = $wallust_accent
    col.inactive_border = $wallust_secondary

    layout = dwindle
    resize_on_border = true
}

windowrule {
    name = ru-hypr-floating-network-tools
    match:class = ^(ru-wifi|ru-bluetooth)$
    float = on
    center = on
    size = 800 600
}

decoration {
    rounding = 12

    active_opacity = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = true 
        size = 1
        passes = 3
    }

    shadow {
        enabled = true
        range = 6
        render_power = 3
    }
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}


