# ru-hypr — personal Hyprland configuration
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24

source = ~/.config/ru-hypr/config/monitors.conf
source = ~/.config/ru-hypr/generated/colors.conf
source = ~/.config/ru-hypr/config/input.conf
source = ~/.config/ru-hypr/config/layout.conf
source = ~/.config/ru-hypr/animations/active.conf
source = ~/.config/ru-hypr/config/keybinds.conf
source = ~/.config/ru-hypr/config/autostart.conf
source = ~/.config/ru-hypr/config/rule.conf
