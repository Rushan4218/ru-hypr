source = ~/.config/ru-hypr/generated/colors.conf
source = ~/.config/ru-hypr/generated/hyprlock-background.conf

general {
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

# ── Glass container ──
shape {
    monitor =
    size = 440, 460
    color = rgba(10, 10, 14, 0.45)
    rounding = 28
    border_size = 1
    border_color = $wallust_accent

    shadow_passes = 3
    shadow_size = 14
    shadow_color = rgba(0, 0, 0, 0.45)
    shadow_boost = 1.1

    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

# ── Username pill background ──
shape {
    monitor =
    size = 320, 55
    color = rgba(255, 255, 255, 0.08)
    rounding = -1
    border_size = 1
    border_color = $wallust_accent

    position = 0, -89
    halign = center
    valign = center
    zindex = 1
}

# ── Greeting ──
label {
    monitor =
    text = <b>$USER</b>
    color = $wallust_fg
    font_size = 20
    font_family = Sans
    position = 0, 179
    halign = center
    valign = center
    zindex = 2
}

# ── Clock ──
label {
    monitor =
    text = <b>$TIME</b>
    color = $wallust_fg
    font_size = 64
    font_family = Sans
    position = 0, 79
    halign = center
    valign = center
    zindex = 2
}

# ── Date ──
label {
    monitor =
    text = cmd[update:60000] echo "<b>$(date +'%A, %B %d')</b>"
    color = $wallust_fg
    font_size = 16
    font_family = Sans
    position = 0, 9
    halign = center
    valign = center
    zindex = 2
}

# ── Username pill text ──
label {
    monitor =
    text = <b>󰀄   $USER</b>
    color = $wallust_fg
    font_size = 16
    font_family = Sans
    position = 0, -89
    halign = center
    valign = center
    zindex = 2
}

# ── Password field ──
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 1
    rounding = -1

    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    outer_color = $wallust_accent
    inner_color = rgba(255, 255, 255, 0.08)
    font_color = $wallust_fg
    check_color = $wallust_accent
    fail_color = rgba(255, 110, 110, 0.9)

    fade_on_empty = false
    placeholder_text = <i>󰌾  Enter Pass</i>

    position = 0, -165
    halign = center
    valign = center
    zindex = 2
}
